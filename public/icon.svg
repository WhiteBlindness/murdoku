  <line x1="166" y1="205" x2="244" y2="205" stroke="#C8922A" stroke-width="7" opacity="0.65"/>
  <line x1="166" y1="235" x2="244" y2="235" stroke="#C8922A" stroke-width="7" opacity="0.65"/>
  <line x1="179" y1="162" x2="179" y2="248" stroke="#C8922A" stroke-width="7" opacity="0.65"/>
  <line x1="205" y1="162" x2="205" y2="248" stroke="#C8922A" stroke-width="7" opacity="0.65"/>
  <line x1="231" y1="162" x2="231" y2="248" stroke="#C8922A" stroke-width="7" opacity="0.65"/>
