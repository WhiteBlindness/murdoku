<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080A08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#D7D3C7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Alibi — a noir murder-mystery logic puzzle. Place the suspects, solve the grid, unmask the killer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alibi" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Alibi</title>

    <!--
      No-flash theme bootstrap. This is the ONLY blocking script and it only
      applies a *remembered user override*. With JS disabled the CSS in
      theme.css still renders a correct theme from prefers-color-scheme.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('murdoku_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add('theme-' + t);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Continuity-desk type payload. Barlow Condensed = industrial headline (titles),
      Courier Prime = case-file typewriter (clues, evidence, timer), Hanken
      Grotesk = dense UI chrome. Weights are pinned deliberately; do not widen
      the ranges without re-checking the transfer size.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      THESIS: Alibi is a continuity desk for reconstructing one account of the night, not a dashboard of cards.
      OWN-WORLD: Magnetic graphite, bone evidence strips, projector amber, oxblood conflict, clipped tabs, and film perforations.
      STORY: Pick or resume a case, follow the next suspect, connect their literal clue to the illustrated board, place them, then accuse.
      FIRST VIEWPORT: Compact masthead, full-width continuity strip, dominant board, right-hand dossier, and one bottom command rail.
      FORM: Continuity Desk, grounded direction 7, seed dcf20905.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
