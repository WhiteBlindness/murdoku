<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0806" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ECE3CF" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Alibi — a noir murder-mystery logic puzzle. Place the suspects, solve the grid, unmask the killer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alibi" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Alibi</title>

    <!--
      No-flash theme bootstrap. This is the ONLY blocking script and it only
      applies a *remembered user override*. With JS disabled the CSS in
      theme.css still renders a correct theme from prefers-color-scheme.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('murdoku_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add('theme-' + t);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
